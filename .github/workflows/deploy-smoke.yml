name: Deploy Smoke Test

on:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Start app and smoke check
        run: |
          node src/server.js &
          sleep 2
          curl -f http://localhost:3000/api/health || (echo "SMOKE FAILED - triggering rollback" && exit 1)
